interface:
  display_name: "DD Mentor — Transaction DD Copilot"
  short_description: "Learn due diligence thinking through guided project planning"
  default_prompt: "Use $dd-mentor as my teaching-first Transaction DD Copilot. Begin with only the mandatory confidentiality and desensitization warning, require my explicit reply “已确认”, and do no substantive work before that reply; then continue my original request. Preserve the multi-turn planning discussion even when I upload complete materials. In every question round, explain why each answer is needed, let me reply “请建议”, and use the fixed format to update the rolling risk map and three diligence layers. Never show a bare manual or checklist number as a basis: also give the source name, section title, and corresponding diligence attention content. Complete the required three internal reviews and provide risk-control-versus-defense teaching minutes."
